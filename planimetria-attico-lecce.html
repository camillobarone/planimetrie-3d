<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Planimetria 3D</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: #13262E; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { display: flex; flex-direction: column; height: 100%; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #EDEEEB; }
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 9px; border: 1px solid #DADDD7; }
  .seg button, .btn { min-height: 40px; min-width: 44px; border: none; border-radius: 7px; padding: 0 10px; font: 600 13px system-ui, sans-serif; cursor: pointer; background: transparent; color: #3d4a50; }
  .seg button[aria-pressed="true"], .btn[aria-pressed="true"] { background: #13262E; color: #fff; }
  .btn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid #DADDD7; background: #fff; color: #13262E; }
  .btn:disabled { opacity: .4; cursor: default; }
  .tools { display: flex; gap: 6px; margin-left: auto; }
  .view { position: relative; flex: 1 1 auto; min-height: 200px; overflow: hidden; background: #fafaf8; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .view canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; }
  .view.misura canvas { cursor: crosshair; }
  #lab { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .l { position: absolute; left: 0; top: 0; white-space: nowrap; transform: translate(-50%, -50%); color: #13262E; font: 700 10.5px/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .07em; padding: 2px 3px; text-shadow: 0 0 2px #fff, 0 0 5px #fff, 0 0 8px #fff; }
  .l.titolo { font-size: 12px; letter-spacing: .14em; color: #56656B; }
  .l.mis { background: #b3261e; color: #fff; text-shadow: none; border-radius: 999px; padding: 4px 8px; font-size: 12px; text-transform: none; letter-spacing: 0; }
  .hint { position: absolute; left: 8px; right: 8px; top: 6px; font-size: 11px; color: #56656B; pointer-events: none; text-shadow: 0 0 3px #fafaf8; }
  .foot { padding: 6px 8px 8px; border-top: 1px solid #EDEEEB; font-size: 11px; line-height: 1.35; color: #56656B; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-bottom: 3px; color: #13262E; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; border: 1px solid #DADDD7; }
  .sole { display: none; padding: 6px 8px 7px; border-top: 1px solid #EDEEEB; font-size: 11px; color: #56656B; }
  .wrap.console .sole { display: block; }   /* fascia sotto il disegno: la casa si reinquadra sopra */
  .wrap.console .foot { display: none; }    /* col sole acceso la nota sotto cede il posto: nel riquadro della scheda (315x500) la pianta restava a 211 px */
  .sole .seg { display: inline-flex; }
  .sole .seg button { min-height: 34px; min-width: 40px; padding: 0 8px; font-size: 12px; }
  .sole .riga { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .sole input[type=range] { flex: 1 1 auto; min-width: 0; height: 30px; accent-color: #13262E; }
  .sole output { font: 700 13px system-ui, sans-serif; color: #13262E; min-width: 40px; text-align: right; }
  #tramonto { display: none; color: #13262E; font-weight: 600; margin-top: 2px; }
  .nord { position: absolute; right: 8px; top: 24px; width: 30px; height: 30px; display: none; pointer-events: none; color: #13262E; }
  .view.pianta .nord { display: block; }
  @media (max-width: 420px) { .seg button { padding: 0 8px; } .btn { padding: 0 8px; } }
  /* riquadro della scheda a 300 px: con piu' piani la barra va su tre righe e col sole il fondo usciva di 9-13 px */
  @media (max-width: 320px) { .bar { gap: 4px 6px; padding: 4px 6px; } .sole { padding: 4px 8px 5px; } .sole .seg button { min-height: 30px; } .sole input[type=range] { height: 28px; } .sole .riga { margin-top: 2px; } }
  #errore { display: none; position: absolute; inset: 12px; font-size: 13px; color: #56656B; }
  #soleBtn { background: #FFF04D; border-color: #D9BE00; color: #13262E; }
  #soleBtn[aria-pressed="true"] { background: #13262E; border-color: #13262E; color: #FFF04D; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="seg" id="livSel" role="group" aria-label="Piano"></div>
    <div class="seg" id="viewSel" role="group" aria-label="Vista">
      <button type="button" data-v="3d">3D</button>
      <button type="button" data-v="top">Pianta</button>
    </div>
    <div class="tools">
      <button type="button" class="btn" id="misBtn" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>Misura</button>
      <button type="button" class="btn" id="soleBtn" aria-pressed="false" aria-label="Sole: luce e ombre per giorno e ora"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" class="btn" id="canBtn" aria-label="Cancella le misure" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
  </div>
  <div class="view" id="view"><div id="lab"></div><div class="hint" id="hint"></div><div id="errore">Il modello 3D non si apre su questo dispositivo.</div>
    <svg class="nord" id="nord" viewBox="0 0 30 30" aria-hidden="true"><g id="nordG"><path d="M15 3 20 17 15 14 10 17z" fill="currentColor"/><text x="15" y="27" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">N</text></g></svg>
  </div>
  <div class="sole" id="solePan">
      <div class="seg" id="dataSel" role="group" aria-label="Giorno">
        <button type="button" data-d="oggi">Oggi</button><button type="button" data-d="3-21">21 mar</button><button type="button" data-d="6-21">21 giu</button><button type="button" data-d="12-21">21 dic</button>
      </div>
      <div class="riga"><input type="range" id="ora" min="300" max="1290" step="15" aria-label="Ora"><output id="oraTxt"></output></div>
      <div id="tramonto">Sole sotto l'orizzonte: nessuna luce diretta</div>
      <div>Le ombre tengono conto solo di questo immobile: gli edifici vicini e gli alberi ne aggiungono altre. Orientamento e misure indicativi.</div>
    </div>
  <div class="foot"><div class="legend" id="legend"></div><span id="nota"></span></div>
</div>
