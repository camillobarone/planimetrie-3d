<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Planimetria 3D</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: #13262E; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { display: flex; flex-direction: column; height: 100%; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #EDEEEB; }
  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 9px; border: 1px solid #DADDD7; }
  .seg button, .btn { min-height: 40px; min-width: 44px; border: none; border-radius: 7px; padding: 0 10px; font: 600 13px system-ui, sans-serif; cursor: pointer; background: transparent; color: #3d4a50; }
  .seg button[aria-pressed="true"], .btn[aria-pressed="true"] { background: #13262E; color: #fff; }
  .btn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid #DADDD7; background: #fff; color: #13262E; }
  .btn:disabled { opacity: .4; cursor: default; }
  .tools { display: flex; gap: 6px; margin-left: auto; }
  .view { position: relative; flex: 1 1 auto; min-height: 200px; overflow: hidden; background: #fafaf8; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .view canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; }
  .view.misura canvas { cursor: crosshair; }
  #lab { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .l { position: absolute; left: 0; top: 0; white-space: nowrap; transform: translate(-50%, -50%); color: #13262E; font: 700 10.5px/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .07em; padding: 2px 3px; text-shadow: 0 0 2px #fff, 0 0 5px #fff, 0 0 8px #fff; }
  .l.titolo { font-size: 12px; letter-spacing: .14em; color: #56656B; }
  .l.mis { background: #b3261e; color: #fff; text-shadow: none; border-radius: 999px; padding: 4px 8px; font-size: 12px; text-transform: none; letter-spacing: 0; }
  .hint { position: absolute; left: 8px; right: 8px; top: 6px; font-size: 11px; color: #56656B; pointer-events: none; text-shadow: 0 0 3px #fafaf8; }
  .foot { padding: 6px 8px 8px; border-top: 1px solid #EDEEEB; font-size: 11px; line-height: 1.35; color: #56656B; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-bottom: 3px; color: #13262E; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; border: 1px solid #DADDD7; }
  .sole { display: none; padding: 6px 8px 7px; border-top: 1px solid #EDEEEB; font-size: 11px; color: #56656B; }
  .wrap.console .sole { display: block; }   /* fascia sotto il disegno: la casa si reinquadra sopra */
  .wrap.console .foot { display: none; }    /* col sole acceso la nota sotto cede il posto: nel riquadro della scheda (315x500) la pianta restava a 211 px */
  .sole .seg { display: inline-flex; }
  .sole .seg button { min-height: 34px; min-width: 40px; padding: 0 8px; font-size: 12px; }
  .sole .riga { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .sole input[type=range] { flex: 1 1 auto; min-width: 0; height: 30px; accent-color: #13262E; }
  .sole output { font: 700 13px system-ui, sans-serif; color: #13262E; min-width: 40px; text-align: right; }
  #tramonto { display: none; color: #13262E; font-weight: 600; margin-top: 2px; }
  .nord { position: absolute; right: 8px; top: 24px; width: 30px; height: 30px; display: none; pointer-events: none; color: #13262E; }
  .view.pianta .nord { display: block; }
  @media (max-width: 420px) { .seg button { padding: 0 8px; } .btn { padding: 0 8px; } }
  /* riquadro della scheda a 300 px: con piu' piani la barra va su tre righe e col sole il fondo usciva di 9-13 px */
  @media (max-width: 320px) { .bar { gap: 4px 6px; padding: 4px 6px; } .sole { padding: 4px 8px 5px; } .sole .seg button { min-height: 30px; } .sole input[type=range] { height: 28px; } .sole .riga { margin-top: 2px; } }
  #errore { display: none; position: absolute; inset: 12px; font-size: 13px; color: #56656B; }
  #soleBtn { background: #FFF04D; border-color: #D9BE00; color: #13262E; }
  #soleBtn[aria-pressed="true"] { background: #13262E; border-color: #13262E; color: #FFF04D; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="seg" id="livSel" role="group" aria-label="Piano"></div>
    <div class="seg" id="viewSel" role="group" aria-label="Vista">
      <button type="button" data-v="3d">3D</button>
      <button type="button" data-v="top">Pianta</button>
    </div>
    <div class="tools">
      <button type="button" class="btn" id="misBtn" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>Misura</button>
      <button type="button" class="btn" id="soleBtn" aria-pressed="false" aria-label="Sole: luce e ombre per giorno e ora"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" class="btn" id="canBtn" aria-label="Cancella le misure" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
  </div>
  <div class="view" id="view"><div id="lab"></div><div class="hint" id="hint"></div><div id="errore">Il modello 3D non si apre su questo dispositivo.</div>
    <svg class="nord" id="nord" viewBox="0 0 30 30" aria-hidden="true"><g id="nordG"><path d="M15 3 20 17 15 14 10 17z" fill="currentColor"/><text x="15" y="27" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">N</text></g></svg>
  </div>
  <div class="sole" id="solePan">
      <div class="seg" id="dataSel" role="group" aria-label="Giorno">
        <button type="button" data-d="oggi">Oggi</button><button type="button" data-d="3-21">21 mar</button><button type="button" data-d="6-21">21 giu</button><button type="button" data-d="12-21">21 dic</button>
      </div>
      <div class="riga"><input type="range" id="ora" min="300" max="1290" step="15" aria-label="Ora"><output id="oraTxt"></output></div>
      <div id="tramonto">Sole sotto l'orizzonte: nessuna luce diretta</div>
      <div>Le ombre tengono conto solo di questo immobile: gli edifici vicini e gli alberi ne aggiungono altre. Orientamento e misure indicativi.</div>
    </div>
  <div class="foot"><div class="legend" id="legend"></div><span id="nota"></span></div>
</div>

      sole.intensity = 2.4; sole.position.copy(c).addScaledVector(dir, r * 2); sole.target.position.copy(c);
      ombre = su && !software;
      if (ombre) {
        var sc = sole.shadow.camera; sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.near = 0.1; sc.far = r * 4; sc.updateProjectionMatrix();
        sole.shadow.bias = -0.0005; sole.shadow.normalBias = 0.02;
        var lato = view.clientWidth < 500 ? 1024 : 2048;
        if (sole.shadow.mapSize.x !== lato) { sole.shadow.mapSize.set(lato, lato); if (sole.shadow.map) { sole.shadow.map.dispose(); sole.shadow.map = null; } }
      }
      stato_sole = { on: true, istante: ist.toISOString(), azimut: ps.azimut, elevazione: ps.elevazioneApparente, dir: [dir.x, dir.y, dir.z], nord: [NORD.x, NORD.z] };
    }
    if (renderer.shadowMap.enabled !== ombre) {   // cambiando le ombre i materiali vanno ricompilati
      renderer.shadowMap.enabled = ombre; sole.castShadow = ombre;
      scene.traverse(function (o) { if (o.material) [].concat(o.material).forEach(function (m) { m.needsUpdate = true; }); });
    }
    stato_sole.ombre = ombre; stato_sole.software = software;
    view.dataset.sole = JSON.stringify(stato_sole);   // lettura per il collaudo e per chi controlla dal browser
    disegna();
  }
  function mostraOra() { var m = luce.minuti; document.getElementById("oraTxt").textContent = Math.floor(m / 60) + ":" + ("0" + m % 60).slice(-2); }

  function proietta(p) {
    var v = p.clone().project(cam);
    return { x: (v.x + 1) / 2 * view.clientWidth, y: (1 - v.y) / 2 * view.clientHeight, dentro: v.z > -1 && v.z < 1 };
  }
  function posa(div, p) { var q = proietta(p); div.style.transform = "translate(" + q.x + "px," + q.y + "px) translate(-50%,-50%)"; return q; }

  function disegna() {
    if (!controls) return;
    scalaPunti();
    renderer.render(scene, cam);
    if (stato.vista === "top") {   // freccia del nord: direzione del nodo North proiettata sullo schermo
      var c0 = proietta(controls.target), c1 = proietta(controls.target.clone().add(NORD));
      document.getElementById("nordG").setAttribute("transform", "rotate(" + (Math.atan2(c1.x - c0.x, c0.y - c1.y) * 180 / Math.PI) + " 15 15)");
    }
    var occupati = [], W = view.clientWidth, H = view.clientHeight;
    function libero(r) {
      if (r.left < 0 || r.top < 0 || r.right > W || r.bottom > H) return false;
      for (var i = 0; i < occupati.length; i++) { var o = occupati[i]; if (r.left < o.right && r.right > o.left && r.top < o.bottom && r.bottom > o.top) return false; }
      return true;
    }
    function piazza(div, p, forza) {
      div.style.visibility = "visible";
      var q = posa(div, p), w = div.offsetWidth, h = div.offsetHeight;
      if (forza) {   // le quote restano dentro il riquadro anche se il loro punto esce
        q.x = Math.min(Math.max(q.x, w / 2 + 2), W - w / 2 - 2); q.y = Math.min(Math.max(q.y, h / 2 + 2), H - h / 2 - 2);
        div.style.transform = "translate(" + q.x + "px," + q.y + "px) translate(-50%,-50%)";
      }
      var r = { left: q.x - w / 2, right: q.x + w / 2, top: q.y - h / 2, bottom: q.y + h / 2 };
      if (forza) {
        var tocca = function (r) { return occupati.some(function (o) { return r.left < o.right && r.right > o.left && r.top < o.bottom && r.bottom > o.top; }); };
        for (var k = 1; k <= 6 && tocca(r); k++) {   // prova sotto e sopra, a passi di un'altezza
          var dy = Math.ceil(k / 2) * (h + 3) * (k % 2 ? 1 : -1), y2 = Math.min(Math.max(q.y + dy, h / 2 + 2), H - h / 2 - 2);
          var r2 = { left: r.left, right: r.right, top: y2 - h / 2, bottom: y2 + h / 2 };
          if (!tocca(r2)) { r = r2; div.style.transform = "translate(" + q.x + "px," + y2 + "px) translate(-50%,-50%)"; }
        }
      }
      if (!q.dentro || (!forza && !libero(r))) { div.style.visibility = "hidden"; return; }
      occupati.push(r);
    }
    misure.forEach(function (m) { if (m.div) piazza(m.div, m.mezzo, true); });
    etichette.forEach(function (e) {
      var on = (stato.liv === "tutti" || stato.liv === e.liv);
      if (!on) { e.div.style.visibility = "hidden"; return; }
      piazza(e.div, e.nodo.getWorldPosition(new T.Vector3()), false);
    });
    Object.keys(titoli).forEach(function (k) {
      var t = titoli[k];
      if (stato.liv !== "tutti" && stato.liv !== k) { t.div.style.visibility = "hidden"; return; }
      piazza(t.div, t.nodo.getWorldPosition(new T.Vector3()), false);
    });
  }

  function applica(nuovoPiano) {
    LIVELLI.forEach(function (k) {   // un piano alla volta nella sua posizione; in «Tutti» affiancati, come nelle tavole
      gruppi[k].visible = stato.liv === "tutti" || stato.liv === k;
      gruppi[k].position.copy(stato.liv === "tutti" ? sposta[k] : new T.Vector3());
    });
    document.querySelectorAll("#livSel button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.l === stato.liv)); });
    document.querySelectorAll("#viewSel button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.v === stato.vista)); });
    if (nuovoPiano) cancella();   // le misure restano passando fra 3D e Pianta; cambiando piano i piani si spostano
    inquadra();
    aggiornaHint();
  }

  function aggiornaHint() {
    hint.textContent = stato.misura ? (inCorso ? "Tocca il secondo muro" : "Tocca una stanza, oppure due muri, per misurare")
      : "Trascina per ruotare, due dita per lo zoom";
  }

  // --- misura. Un tocco dentro una stanza: le due quote da muro a muro che passano di li' (assi della casa).
  // Un tocco su un muro, o a meno di 15 px (al massimo 40 cm) dalla sua faccia: punto agganciato alla faccia; due punti = distanza.
  var MAT_MIS = new T.LineBasicMaterial({ color: 0xb3261e, depthTest: false });
  var MAT_PUNTO = new T.MeshBasicMaterial({ color: 0xb3261e, depthTest: false });
  var ray = new T.Raycaster();
  var punti = [], CERCHIO = new T.CircleGeometry(1, 20);
  function punto(p, agganciato) {
    var m = new T.Mesh(CERCHIO, MAT_PUNTO);   // raggio 1, riscalato in scalaPunti(): 6 px, 9 se agganciato
    m.rotation.x = -Math.PI / 2; m.position.copy(p); m.renderOrder = 10; m.userData.px = agganciato ? 9 : 6;
    scene.add(m); punti.push(m); scalaPunti(); return m;
  }
  function wpp(p) {   // metri per pixel CSS nel punto p
    var H = view.clientHeight || 1;
    return cam.isOrthographicCamera ? (cam.top - cam.bottom) / cam.zoom / H : 2 * cam.position.distanceTo(p) * Math.tan(cam.fov * Math.PI / 360) / H;
  }
  var ASSI = [new T.Vector3(1, 0, 0), new T.Vector3(-1, 0, 0), new T.Vector3(0, 0, 1), new T.Vector3(0, 0, -1)], rayM = new T.Raycaster();
  var quoteMis = {};   // per livello: 0,95 di ogni altezza di muro letta dal GLB (piano, vani bassi, muretti), sopra architravi e davanzali
  // vincolo: 0,95*h cade nell'architrave solo se h <= 2,1 (architrave da h-0,1) o h >= ~2,35 (architrave da 2,10/2,20);
  // un vano alto fra 2,1 e 2,35 m farebbe passare il raggio sotto l'architrave: oggi nessuno (1,70, 2,70 e oltre)
  function muriDi(liv) {   // solo i muri del suo piano (varchi invisibili compresi): in «Tutti» gli altri piani stanno accanto
    var lista = []; gruppi[liv].traverse(function (o) { if (o.isMesh && o.userData.muro) lista.push(o); }); return lista;
  }
  // assi della misura: quelli del muro piu' vicino al tocco (stanze storte o con muri curvi), o quelli del disegno
  // se quel muro e' dritto entro 3 gradi
  function assiPer(p, liv) {
    var lista = muriDi(liv), best = null;
    quoteMis[liv].forEach(function (q) {
      var o = p.clone(); o.y = pavimentoDi(liv) + q;
      ASSI.forEach(function (d) { rayM.set(o, d); rayM.far = 40; var h = rayM.intersectObjects(lista, false)[0]; if (h && h.face && (!best || h.distance < best.distance)) best = h; });
    });
    if (!best) return ASSI;
    var n = best.face.normal.clone().transformDirection(best.object.matrixWorld); n.y = 0;
    if (n.lengthSq() < 1e-6) return ASSI;
    n.normalize();
    if (Math.abs(n.x) > 0.9986 || Math.abs(n.z) > 0.9986) return ASSI;
    var t = new T.Vector3(-n.z, 0, n.x);
    return [n, n.clone().negate(), t, t.clone().negate()];
  }
  function distanzeMuri(p, liv, assi) {   // dal punto p ai muri lungo i 4 assi: per ogni asse il muro piu' vicino fra le quote del piano
    var lista = muriDi(liv);
    return quoteMis[liv].map(function (q) {
      var alto = p.clone(); alto.y = pavimentoDi(liv) + q;
      return assi.map(function (d) { rayM.set(alto, d); rayM.far = 40; var h = rayM.intersectObjects(lista, false)[0]; return h ? h.distance : null; });
    }).reduce(function (a, b) {
      return a.map(function (d, i) { return d === null ? b[i] : b[i] === null ? d : Math.min(d, b[i]); });
    });
  }
  function pavimentoDi(liv) { return 0; }   // ogni piano ha il pavimento a quota 0 nel suo gruppo
  function segmento(a, b) {
    var g = new T.BufferGeometry(); g.setAttribute("position", new T.Float32BufferAttribute([a.x, a.y, a.z, b.x, b.y, b.z], 3));
    var l = new T.Line(g, MAT_MIS); l.renderOrder = 10; scene.add(l); return l;
  }
  function metri(d) { return d.toFixed(1).replace(".", ",") + " m"; }
  function scalaPunti() {   // punti di dimensione costante sullo schermo, visibili sotto il dito
    var H = view.clientHeight || 1;
    punti.forEach(function (m) {
      var wpp = cam.isOrthographicCamera ? (cam.top - cam.bottom) / cam.zoom / H
        : 2 * cam.position.distanceTo(m.position) * Math.tan(cam.fov * Math.PI / 360) / H;
      m.scale.setScalar((m.userData.px || 6) * wpp);
    });
  }
  function togli(o) { scene.remove(o); if (o.geometry !== CERCHIO) o.geometry.dispose(); var i = punti.indexOf(o); if (i >= 0) punti.splice(i, 1); }
  function tocco(cx, cy) {
    var r = renderer.domElement.getBoundingClientRect();
    ray.setFromCamera(new T.Vector2((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1), cam);
    var hits = ray.intersectObjects(visibili(), true).filter(function (h) { return h.object.isMesh && h.object.visible && !h.object.userData.soloOmbra && h.object.material && !h.object.material.transparent; });
    if (!hits.length) return;
    var h = hits[0], liv = livelloDi(h.object);
    if (!liv) return;
    var p = new T.Vector3(h.point.x, pavimentoDi(liv) + 0.03, h.point.z);
    var assi = assiPer(p, liv), dm = distanzeMuri(p, liv, assi), vicino = -1, tol = h.object.userData.muro ? 0.4 : Math.min(15 * wpp(p), 0.4);   // 15 px, ma mai oltre 40 cm: da lontano 15 px sono un metro
    dm.forEach(function (d, i) { if (d !== null && d < tol && (vicino < 0 || d < dm[vicino])) vicino = i; });
    if (!h.object.userData.muro && vicino < 0) { quoteStanza(p, dm, assi); return; }
    if (vicino >= 0) p.addScaledVector(assi[vicino], dm[vicino]);   // aggancio alla faccia del muro
    var agg = vicino >= 0;
    if (!inCorso || inCorso.liv !== liv) {
      if (inCorso) togli(inCorso.a);
      inCorso = { liv: liv, p: p, a: punto(p, agg), agg: agg };
      document.getElementById("canBtn").disabled = false;   // anche un primo punto sbagliato si puo' togliere
    } else {
      var a = inCorso.p, dx = p.x - a.x, dz = p.z - a.z;
      if (!agg && !inCorso.agg) {   // quasi in asse: in asse, ma solo fra punti liberi (un punto agganciato a un muro storto ci resta)
        if (Math.abs(dx) < Math.abs(dz) * 0.07) p.x = a.x; else if (Math.abs(dz) < Math.abs(dx) * 0.07) p.z = a.z;
      }
      var linea = segmento(a, p);
      var d = Math.hypot(p.x - a.x, p.z - a.z);
      var m = { oggetti: [inCorso.a, punto(p, agg), linea], mezzo: a.clone().add(p).multiplyScalar(0.5), div: el("mis", metri(d)) };
      misure.push(m); inCorso = null;
      document.getElementById("canBtn").disabled = false;
    }
    aggiornaHint(); disegna();
  }
  function quoteStanza(p, dm, ASSI) {   // una quota per asse della stanza; il numero sta a meta' del tratto piu' lungo, lontano dal tocco
    misure = misure.filter(function (m) { if (!m.auto) return true; m.oggetti.forEach(togli); lab.removeChild(m.div); return false; });
    if (inCorso) { togli(inCorso.a); inCorso = null; }
    [[0, 1], [2, 3]].forEach(function (c) {
      var d1 = dm[c[0]], d2 = dm[c[1]];
      if (d1 === null || d2 === null) return;   // da una parte non c'e' muro (veranda): niente quota
      var a = p.clone().addScaledVector(ASSI[c[1]], d2), b = p.clone().addScaledVector(ASSI[c[0]], d1);
      var mezzo = d1 >= d2 ? p.clone().addScaledVector(ASSI[c[0]], d1 / 2) : p.clone().addScaledVector(ASSI[c[1]], d2 / 2);
      misure.push({ auto: true, oggetti: [punto(a, true), punto(b, true), segmento(a, b)], mezzo: mezzo, div: el("mis", metri(d1 + d2)) });
    });
    document.getElementById("canBtn").disabled = !misure.length;
    aggiornaHint(); disegna();
  }
  function cancella() {
    misure.forEach(function (m) { m.oggetti.forEach(togli); lab.removeChild(m.div); });
    if (inCorso) togli(inCorso.a);
    misure = []; inCorso = null;
    document.getElementById("canBtn").disabled = true;
    aggiornaHint(); disegna();
  }
  // tocco = un solo dito (o tasto sinistro), fermo e breve; un secondo dito (pizzico) o il tasto destro lo annullano
  var giu = null;
  renderer.domElement.addEventListener("pointerdown", function (e) {
    giu = (e.isPrimary && e.button === 0) ? { x: e.clientX, y: e.clientY, t: Date.now() } : null;
  });
  renderer.domElement.addEventListener("pointercancel", function () { giu = null; });
  renderer.domElement.addEventListener("pointerup", function (e) {
    if (!giu || !e.isPrimary) return;
    var corto = Math.hypot(e.clientX - giu.x, e.clientY - giu.y) < 10 && Date.now() - giu.t < 700;
    giu = null;
    if (corto && stato.misura) tocco(e.clientX, e.clientY);
  });

  document.getElementById("livSel").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b && b.dataset.l !== stato.liv) { stato.liv = b.dataset.l; applica(true); } });
  document.getElementById("viewSel").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { stato.vista = b.dataset.v; vistaPrima = null; applica(false); } });
  var vistaPrima = null;
  document.getElementById("misBtn").addEventListener("click", function () {
    stato.misura = !stato.misura; this.setAttribute("aria-pressed", String(stato.misura));
    view.classList.toggle("misura", stato.misura);
    if (!stato.misura && inCorso) { togli(inCorso.a); inCorso = null; document.getElementById("canBtn").disabled = !misure.length; disegna(); }
    if (stato.misura && stato.vista !== "top") { vistaPrima = stato.vista; stato.vista = "top"; applica(false); }   // in pianta i muri sono dritti
    else if (!stato.misura && vistaPrima) { stato.vista = vistaPrima; vistaPrima = null; applica(false); }
    aggiornaHint();
  });
  document.getElementById("canBtn").addEventListener("click", cancella);
  document.getElementById("soleBtn").addEventListener("click", function () {
    if (!D.sole || !nordTrovato) return;   // senza nord letto sul catastale il sole non si accende, neanche da codice
    luce.on = !luce.on; this.setAttribute("aria-pressed", String(luce.on)); view.parentNode.classList.toggle("console", luce.on); rifare = true;
    if (luce.on && luce.data === "oggi") {   // si parte dall'ora di adesso, a passi di 15 minuti, dentro il cursore
      var q = parti(Date.now());
      luce.minuti = Math.min(1290, Math.max(300, Math.round((q.hour * 60 + q.minute) / 15) * 15));
    }
    document.getElementById("ora").value = luce.minuti; mostraOra(); segnaData(); aggiornaSole();
  });
  function segnaData() { document.querySelectorAll("#dataSel button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.d === luce.data)); }); }
  document.getElementById("dataSel").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { luce.data = b.dataset.d; segnaData(); aggiornaSole(); } });
  document.getElementById("ora").addEventListener("input", function () { luce.minuti = +this.value; mostraOra(); aggiornaSole(); });

  var bin = atob(GLB), buf = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  function guasto(e) { if (e) console.error(e); document.getElementById("errore").style.display = "block"; }
  new T.GLTFLoader().parse(buf.buffer, "", function (gltf) { try { avvia(gltf); } catch (e) { guasto(e); } }, guasto);
  function avvia(gltf) {
    var root = gltf.scene; scene.add(root);
    LIVELLI.forEach(function (k) { gruppi[k] = root.getObjectByName("Level_" + k); });
    var cima = new T.MeshBasicMaterial({ color: "#33454c" });
    var soffitto = new T.MeshBasicMaterial({ colorWrite: false, depthWrite: false });   // solai: non si vedono, fanno ombra   // taglio dei muri: scuro e senza luce, come il nero del catastale
    root.traverse(function (o) {
      if (o.isMesh && [].concat(o.material).some(function (m) { return m.name === "M_Wall_Cut_Top"; })) {
        o.material = Array.isArray(o.material) ? o.material.map(function (m) { return m.name === "M_Wall_Cut_Top" ? cima : m; }) : cima;
      }
      if (o.isMesh) {
        var vetro = [].concat(o.material).some(function (m) { return m.transparent; });
        o.castShadow = !vetro; o.receiveShadow = !vetro; o.userData.vetro = vetro;
        if (!vetro && [o.name, o.parent ? o.parent.name : ""].some(function (n) { return /^L\d\d_(Wall|Parapet)_/.test(n); })) {
          o.userData.muro = true; [].concat(o.material).forEach(function (m) { m.side = T.DoubleSide; });   // chiusi: nessuna differenza a vista
        }
      }
      if (o.name === "North") { NORD.set(o.position.x, 0, o.position.z).normalize(); EST.set(-NORD.z, 0, NORD.x); nordTrovato = true; }   // E = N girato di 90 gradi in senso orario visto dall'alto
      // varchi senza muro: un velo invisibile su cui la misura si ferma (la stanza finisce li'), che il dito e il sole attraversano
      if (o.isMesh && [].concat(o.material).some(function (m) { return m.name === "M_Varco"; })) {
        o.material = soffitto; o.castShadow = false; o.receiveShadow = false; o.userData.soloOmbra = true; o.userData.muro = true;
      }
      if (o.name.indexOf("Ceiling_") === 0) o.traverse(function (m) { if (m.isMesh) { m.material = soffitto; m.receiveShadow = false; m.userData.soloOmbra = true; } });
      if (o.name.indexOf("Label_") === 0) {
        var k = o.name.slice(6);
        if (D.stanze[k]) etichette.push({ nodo: o, liv: k.split("_")[0], k: k, div: el("", D.stanze[k]) });
      } else if (o.name.indexOf("Title_") === 0) {
        var t = o.name.slice(6); titoli[t] = { nodo: o, div: el("titolo", TITOLI[t]) };
      }
    });
    if (!nordTrovato) { document.getElementById("soleBtn").style.display = "none"; document.getElementById("nord").style.visibility = "hidden"; }
    etichette.sort(function (a, b) { return PRIORITA.indexOf(a.k) - PRIORITA.indexOf(b.k); });
    var x = 0;
    LIVELLI.forEach(function (l) {
      var cime = {};   // altezze distinte dei muri del piano (cm): il piano e, se ci sono, i vani bassi (h 1,70, h 4) e i muretti (1 m)
      gruppi[l].traverse(function (o) { if (o.isMesh && o.userData.muro && !/_(Sill|Lintel)/.test(o.name + (o.parent ? o.parent.name : ""))) cime[Math.round(new T.Box3().setFromObject(o).max.y * 100)] = 1; });
      quoteMis[l] = Object.keys(cime).map(function (h) { return h / 100 * 0.95; });
      var bl = new T.Box3().setFromObject(gruppi[l]);   // "Tutti": piani affiancati da sinistra, dal piu' basso, 2,5 m fra l'uno e l'altro
      sposta[l] = new T.Vector3(x - bl.min.x, 0, 0); x += bl.max.x - bl.min.x + 2.5;
    });
    applica(true);
    var largPrima = 0;
    new ResizeObserver(function () {
      if (!view.clientWidth) return;
      renderer.setSize(view.clientWidth, view.clientHeight, false);
      if (!avviato) { avviato = true; stato.liv = view.clientWidth < 600 || LIVELLI.length < 2 ? D.principale : "tutti"; applica(true); }   // telefono: il piano principale
      else if (view.clientWidth !== largPrima || rifare) { rifare = false; inquadra(); }   // larghezza nuova, o fascia del sole aperta/chiusa
      else {   // cambia solo l'altezza (barra del browser): proporzioni nuove, stessa vista dell'utente
        var asp = view.clientWidth / (view.clientHeight || 1);
        camP.aspect = asp; camP.updateProjectionMatrix();
        var mezza = (camO.top - camO.bottom) / 2; camO.left = -mezza * asp; camO.right = mezza * asp; camO.updateProjectionMatrix();
        disegna();
      }
      largPrima = view.clientWidth;
    }).observe(view);
  }
})();
</script>
